name: CI

# 门禁顺序依 02 §3：ruff → mypy --strict → pytest（含覆盖率判定）→ 契约/黄金样本测试。
# 契约与文档健康测试在 tests/ 里，由 pytest 一并执行；黄金样本目录在 Step 2 前有内容后自动纳入。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv（钉死版本，与本机一致）
        run: |
          curl -LsSf https://astral.sh/uv/0.12.16/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 同步依赖（--frozen：uv.lock 与 pyproject 不一致即失败）
        run: uv sync --frozen

      - name: ruff check
        run: uv run --frozen ruff check .

      - name: ruff format --check
        run: uv run --frozen ruff format --check .

      - name: mypy --strict
        run: uv run --frozen mypy

      - name: pytest（含覆盖率门禁与契约/文档健康测试）
        run: uv run --frozen pytest

      # 必须在 pytest 之后：它消费 pytest 落地的 .coverage.json（不放进 pytest 里，
      # 是因为 pytest-cov 在会话结束才写文件，测试中读到的永远是上一轮的数）。
      - name: 核心模块覆盖率门禁（02 §2 DoD-5）
        run: uv run --frozen python tools/check_coverage.py

  # 前端门禁（ADR-0018）：类型检查 + 构建。产物不进 CI，只验证能构建。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node（钉死大版本）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 同步依赖（npm ci：lock 不一致即失败）
        run: npm ci

      - name: vue-tsc 类型检查 + vite build
        run: npm run build
