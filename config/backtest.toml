# 日内回测的成本与执行假设（07 §5.2 的实现配置；形态见 ADR-0010）
#
# 这张表是成本参数的**唯一真源**：代码里没有兜底默认值，缺文件或缺键就直接失败
# （与 `gate.toml` 同一条 fail-closed）。理由在 ADR-0010 决定 8——用一个"看起来像"的
# 费率跑出正期望，比跑不出来危险得多。
#
# 单位一律是**百分点**（0.025 = 万分之 2.5），与 `gate.toml` 的 `limits_pct` 同一口径，
# 省掉"这里是小数那里是百分数"的一种错。

[cost]
# 佣金：双边各收，单笔不足最低额时按最低额收（"最低 5 元"是券商行的通行条款，
# 不收它等于给小单免了成本，而做T 恰恰全是小单）。
commission_pct = 0.025
commission_min = 5.0
# 印花税：只在卖出单边收（2023-08-28 起的现行标准）。买的时候不收，所以它进卖出那一笔。
stamp_pct = 0.05
# 过户费：双边收，沪深同一费率（2022-04-29 起）。
transfer_pct = 0.001
# 滑点：成交价在开盘价基础上向不利方向让出的比例（买加、卖减）。它写在价上而不是写在费上，
# 因为 07 §5.2 要模型的是"人看到信号再到下单，价格已经动了"这件事，那是价格不是费用。
slippage_pct = 0.02

[execution]
# 信号之后隔几根K线成交。最小 1：0 根就是"用信号所在那根的开盘价成交"，而那一根还没走完
# （`ts` 是收盘时刻，ADR-0009 决定 2），那是 07 §5.2 明令禁止的信号价成交。
delay_bars = 1
# 单笔委托占那根K线成交量的比例上限（%）。超了就是"我这单把价格推走了"，回测却按原价成交。
max_participation_pct = 5.0
