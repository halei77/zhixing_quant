# 提示词模板表（06 §五）。改这个文件即生效，不需要改代码（06 §八-2）；
# 反幻觉固定头部不在这里——它由 `site/compose.py` 钉死，模板只能追加"输出要求"（ADR-0011 决定 4）。
#
# 默认组合是草案值（06 §五 底下那句）。草案值改一次就在这里改一次，git diff 就是评审记录。
# `days` 数的是**交易日**，与查询层 `Cover.days` 同一口径（ADR-0011 决定 2）。
# `status: pending` 的三条依赖还没落地的组件，站点会让它出现在列表里但拒生成，
# 理由写在 `waiting_on`（一期只有K线，没有财务数据与消息组件——06 §四 的分期）。

token_warn_above: 100000

# 固定头（ADR-0022 决定 1）：装载时合并进**每条**模板的 data，模板取消不掉；CI 断言
# 「每条 ready 模板生效后都含 fundamental_head」钉这份声明在场（06 §八-4 手法）。
# 形态 = 快照两列键值表：名称/代码/收盘日期 + daily_basic 末行的估值与换手，days 1。
always_data:
  - {dataset: fundamental_head, days: 1, fields: [close, total_mv, circ_mv, pe_ttm, pb, ps_ttm, dv_ttm, turnover_rate]}

templates:
  - name: 短期投资
    status: ready
    role: 你是资深 A 股分析师
    task: 判断未来 1–4 周的机会与风险，给出趋势、量价关系、支撑与压力位
    data:
      - {dataset: daily, days: 120}
      # 同窗对齐：四张参考表与日K同一个 days（设计合成 §2.2 同一手法），换窗只改日K那行
      # 再把四行跟着改——不同窗的估值与涨跌停会把"那天"对错位。
      - {dataset: daily_basic, days: 120, fields: [close, pe_ttm, pb, turnover_rate]}
      # 远期 PE（ADR-0022 决定 2）：与日K同 days 同窗逐日点时；四列是规格不是可选项。
      - {dataset: forward_pe, days: 120, fields: [close, fwd_pe, est_period, est_asof]}
      - {dataset: stk_limit, days: 120, fields: [up_limit, down_limit]}
      - {dataset: index_daily, days: 120, fields: [open, high, low, close, volume, amount]}
      - {dataset: minute_60, days: 60}
      - {dataset: minute_30, days: 30}
      - {dataset: minute_5, days: 10}
    format: markdown
    fields: [open, high, low, close, volume, amount]
    adjust: backward
    output: |
      先给结论（看多/看空/观望 + 一句话理由），再给依据。
      每条依据都要引用具体日期与表中的价格，不许出现表中没有的数字。
      最后单列"这个判断最需要哪份数据来验证"。

  - name: 波段
    status: ready
    role: 你是资深 A 股分析师
    task: 给出数周至数月的波段结构，标出可操作的买卖区域
    data:
      - {dataset: daily, days: 250}
      - {dataset: daily_basic, days: 250, fields: [close, pe_ttm, pb, ps_ttm, dv_ttm, total_mv]}
      - {dataset: forward_pe, days: 250, fields: [close, fwd_pe, est_period, est_asof]}
      - {dataset: stk_limit, days: 250, fields: [up_limit, down_limit]}
      - {dataset: index_daily, days: 250, fields: [open, high, low, close, volume, amount]}
      - {dataset: minute_60, days: 90}
    format: markdown
    fields: [open, high, low, close, volume, amount]
    adjust: backward
    output: |
      按"结构—位置—时间"三段作答：先说当前处在波段的哪一段，再给上下沿价位区间，
      最后说预计的时间跨度；每个价位都要能对到表中某一天的价格。

  # 以下三条是 06 §五 的草案，等对应组件落地才进一期。
  - name: 长期投资
    status: ready
    role: 你是资深 A 股基本面分析师
    task: 评估估值水平与基本面趋势
    data:
      - {dataset: daily, days: 750}
      - {dataset: daily_basic, days: 250, fields: [close, pe_ttm, pb, ps_ttm, dv_ttm, total_mv]}
      # 远期 PE 与同模板的估值序列同窗（250，ADR-0016 的长期投资估值窗），不跟日K的 750：
      # 估值族内部同窗对齐，250 也正是一年交易日——点名规格「长期投资 250」。
      - {dataset: forward_pe, days: 250, fields: [close, fwd_pe, est_period, est_asof]}
      - {dataset: forecast, days: 500, fields: [type, net_profit_min, net_profit_max]}
      - {dataset: stk_limit, days: 750, fields: [up_limit, down_limit]}
    format: markdown
    fields: [open, high, low, close, volume, amount]
    adjust: backward
    output: |
      估值部分只允许使用提示词里给出的财务序列；序列缺失的年份明确写「数据未提供」。

  - name: 建仓价分析
    status: pending
    waiting_on: earnings/ROE/增速序列（A 桶财务指标组件验收后落地，daily_basic 只有估值没有盈利）
    role: 你是资深 A 股基本面分析师
    task: 测算合理建仓区间，并给出区间对应的假设
    data:
      - {dataset: daily, days: 250}
      # 转正时不再补：盘上已有的三张先挂上（设计合成 §一"便宜的先做"）。
      - {dataset: daily_basic, days: 250, fields: [close, pe_ttm, pb, ps_ttm, dv_ttm, total_mv]}
      - {dataset: stk_limit, days: 250, fields: [up_limit, down_limit]}
      - {dataset: index_daily, days: 250, fields: [open, high, low, close, volume, amount]}
    format: markdown
    fields: [open, high, low, close, volume, amount]
    adjust: backward
    output: |
      先列假设（增长率、目标估值），再给区间；假设与区间要能逐项对回提供的数据。

  - name: 最新消息解读
    status: pending
    waiting_on: 消息组件（06 §四 列为候选：akshare 新闻接口质量未评估）
    role: 你是资深 A 股事件驱动分析师
    task: 判断消息面对走势的影响与持续时间
    data:
      - {dataset: daily, days: 30}
      # 同上：参考表先挂好，消息组件落地转正时只差它自己那一段。
      - {dataset: daily_basic, days: 30, fields: [close, pe_ttm, pb, turnover_rate]}
      - {dataset: stk_limit, days: 30, fields: [up_limit, down_limit]}
      - {dataset: index_daily, days: 30, fields: [open, high, low, close, volume, amount]}
    format: markdown
    fields: [open, high, low, close, volume, amount]
    adjust: backward
    output: |
      只允许解读提示词内附的消息原文；没有原文时回答「本次未提供消息」，不得推测新闻。
