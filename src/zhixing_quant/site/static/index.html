<!doctype html>
<!-- 知行 · 提示词站点（06 §四 一期、§八-1/5；2026-09-22 iOS 风格重设计）。
     零依赖、无构建步骤：能 fetch 的浏览器就够了。这里不放任何口径：token 估算、
     价格口径、缺口句全部由服务器给（ADR-0013 决定 5）。页面上出现的每个数字都读自 /api/*。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>知行</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d5453c'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E知%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="seal" aria-hidden="true">知行</div>
      <div class="token-field">
        <input id="token" type="password" placeholder="输入口令连接" autocomplete="off" />
        <span id="auth-state" class="dot" title="未连接"></span>
      </div>
    </header>

    <main>
      <section class="glass search-zone">
        <div class="search-wrap">
          <input
            id="search"
            type="search"
            placeholder="搜代码 / 名称 / 拼音，如 600519、茅台、gzmt"
            autocomplete="off"
            enterkeyhint="search"
          />
          <ul id="suggest" class="suggest" hidden></ul>
        </div>
        <p id="search-hint" class="hint">输入至少一个字开始搜索，指数直接搜名字</p>
      </section>

      <section id="quote-card" class="glass quote" hidden>
        <div class="quote-head">
          <div>
            <p id="q-name" class="q-name">—</p>
            <p id="q-code" class="q-code">—</p>
          </div>
          <div class="q-last">
            <p id="q-close" class="q-close">—</p>
            <p id="q-change" class="q-change">—</p>
          </div>
        </div>
        <canvas id="kline" height="260" aria-label="K线图"></canvas>
        <dl id="q-stats" class="q-stats">
          <div><dt>开</dt><dd id="q-open">—</dd></div>
          <div><dt>高</dt><dd id="q-high">—</dd></div>
          <div><dt>低</dt><dd id="q-low">—</dd></div>
          <div><dt>量</dt><dd id="q-vol">—</dd></div>
        </dl>
      </section>

      <section id="prompt-zone" class="glass sheet" hidden>
        <p id="template-note" class="hint"></p>
        <div class="prompt-actions">
          <select id="templates" aria-label="模板"></select>
          <input id="asof" type="date" aria-label="截止日期" />
          <button id="generate" type="button" class="primary">生成</button>
        </div>
        <p id="meter" class="hint"><span id="tokens">—</span> token<span id="warn"></span></p>
        <pre id="preview" class="preview">选一只票，点生成。</pre>
        <button id="copy" type="button" class="primary wide">复制提示词</button>
      </section>
    </main>

    <p id="status" class="status" role="status"></p>
    <script src="/assets/app.js"></script>
  </body>
</html>
